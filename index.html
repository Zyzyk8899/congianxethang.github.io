<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal</title>
    <style>
      :root {
        --bg: #edf3fa;
        --surface: #f4f7fb;
        --panel: rgba(255,255,255,0.8);
        --card: #f5f7fa;
        --line: #dfeaf4;
        --text: #1d2b3a;
        --muted: #5f6f84;
        --blue: #2c6df5;
        --blue-dark: #1d5fe4;
        --blue-soft: #eaf1ff;
        --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      .page {
        max-width: 1400px;
        margin: 0 auto;
        padding: 26px 28px 60px;
      }

      .portal-shell {
        background: rgba(255,255,255,0.35);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 18px 18px 10px;
        box-shadow: var(--shadow);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 8px 18px;
        gap: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .brand-badge {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--blue), #5e8cff);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 20px rgba(44,109,245,0.25);
        color: white;
        font-weight: 800;
        font-size: 28px;
      }

      .brand-text {
        line-height: 1.1;
      }

      .brand-title {
        font-size: clamp(28px, 3vw, 52px);
        font-weight: 800;
        letter-spacing: -0.05em;
      }

      .brand-sub {
        margin-top: 6px;
        font-size: clamp(18px, 1.8vw, 28px);
        color: var(--muted);
        font-weight: 500;
      }

      .top-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .action-btn {
        background: rgba(255,255,255,0.35);
        border: 1px solid rgba(148, 163, 184, 0.4);
        border-radius: 999px;
        padding: 12px 20px;
        font-size: 18px;
        color: #2f4056;
        font-weight: 600;
        cursor: pointer;
      }

      .section-title {
        font-size: clamp(28px, 3vw, 46px);
        font-weight: 800;
        letter-spacing: -0.04em;
        margin: 18px 0 0 0;
        padding-left: 8px;
      }

      .subject-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 18px;
        margin-top: 18px;
      }

      .subject-card {
        background: rgba(255,255,255,0.45);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px 18px 16px;
        box-shadow: var(--shadow);
        min-height: 180px;
        transition: 0.2s ease;
      }

      .subject-card:hover {
        transform: translateY(-2px);
      }

      .subject-card .card-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .card-icon {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--blue-soft), #edf4ff);
        color: var(--blue);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 22px;
      }

      .subject-card h3 {
        font-size: 26px;
        line-height: 1.2;
        margin: 12px 0 10px;
      }

      .subject-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 16px;
      }

      .card-progress {
        margin-top: 16px;
        background: rgba(255,255,255,0.35);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 14px;
        font-weight: 700;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }
        .subject-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="portal-shell">
        <div class="topbar">
          <div class="brand">
            <div class="brand-badge">S</div>
            <div class="brand-text">
              <div class="brand-title">Student Portal</div>
              <div class="brand-sub">Learning Dashboard</div>
            </div>
          </div>

          <div class="top-actions">
            <button class="action-btn">Học tập</button>
            <button class="action-btn">Bài kiểm tra</button>
          </div>
        </div>

        <div class="section-title">Các môn học</div>

        <div id="subjectGrid" class="subject-grid"></div>
      </div>
    </div>

    <script src="questions.js"></script>
    <script>
      const subjectGrid = document.getElementById("subjectGrid");

      function renderSubjects() {
        subjectGrid.innerHTML = "";
        subjects.forEach((subject) => {
          const card = document.createElement("div");
          card.className = "subject-card";

          const firstLetter = subject.name.charAt(0).toUpperCase();

          card.innerHTML = `
            <div class="card-row">
              <div class="card-icon">${firstLetter}</div>
            </div>
            <h3>${subject.name}</h3>
            <p>${subject.description}</p>
            <div class="card-progress">Tiến độ: 0/1</div>
          `;

          subjectGrid.appendChild(card);
        });
      }

      renderSubjects();
    </script>
  </body>
</html>
