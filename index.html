<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Quiz Dashboard</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      .app {
        max-width: 1100px;
        margin: 40px auto;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      }

      .header {
        background: linear-gradient(135deg, #eff6ff, #f8fafc);
        border-bottom: 1px solid #e2e8f0;
        padding: 22px 24px;
      }

      .header h1 {
        margin: 0;
        font-size: 28px;
      }

      .header p {
        margin: 8px 0 0 0;
        color: #475569;
      }

      .tabs {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        padding: 18px 24px 0;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
      }

      .tab {
        background: white;
        border: 1px solid #e2e8f0;
        color: #475569;
        border-radius: 10px;
        padding: 10px 16px;
        cursor: pointer;
        font-weight: 700;
      }

      .tab.active {
        background: #dbeafe;
        color: #1d4ed8;
        border-color: #93c5fd;
      }

      .panel {
        display: none;
        padding: 26px 24px 30px;
      }

      .panel.active {
        display: block;
      }

      .subject-title {
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 22px;
      }

      .question-box {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 18px 18px 16px;
        margin-bottom: 22px;
      }

      .question {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 16px;
      }

      .answers {
        display: grid;
        gap: 12px;
      }

      .answer {
        width: 100%;
        text-align: left;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #f8fafc;
        padding: 14px 16px;
        cursor: pointer;
        font-size: 16px;
        color: #0f172a;
      }

      .answer:hover {
        border-color: #93c5fd;
        background: #eff6ff;
      }

      .answer.correct {
        background: #dcfce7;
        border-color: #86efac;
        color: #166534;
      }

      .answer.wrong {
        background: #fee2e2;
        border-color: #fca5a5;
        color: #991b1b;
      }

      .result {
        display: none;
        margin-top: 16px;
        padding: 12px 14px;
        border-radius: 10px;
        font-weight: 700;
        border: 1px solid #e2e8f0;
      }

      .result.show {
        display: block;
      }

      @media (max-width: 700px) {
        .header {
          padding: 18px 16px;
        }

        .header h1 {
          font-size: 24px;
        }

        .tabs {
          padding-left: 16px;
          padding-right: 16px;
        }

        .panel {
          padding-left: 16px;
          padding-right: 16px;
        }

        .question {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>Study Quiz</h1>
        <p>Web có thể mở rộng cho nhiều môn học</p>
      </div>

      <div id="tabs" class="tabs"></div>
      <div id="panels"></div>
    </div>

    <script>
      // Đây là nơi bạn thêm môn học mới
      const subjects = [
        {
          id: "c-lang",
          name: "Lập trình C",
          questions: [
            {
              question: "Câu nào đúng về C?",
              answers: [
                { text: "A. C chỉ chạy trên web", correct: false },
                { text: "B. C là ngôn ngữ lập trình hệ thống mạnh và nhanh", correct: true },
                { text: "C. C không có biến", correct: false },
                { text: "D. C không có vòng lặp", correct: false }
              ]
            },
            {
              question: "Kiểu dữ liệu nào dùng cho số thực trong C?",
              answers: [
                { text: "A. int", correct: false },
                { text: "B. float", correct: true },
                { text: "C. char", correct: false },
                { text: "D. bool", correct: false }
              ]
            },
            {
              question: "Hàm nào dùng để in ra màn hình trong C?",
              answers: [
                { text: "A. scanf", correct: false },
                { text: "B. if", correct: false },
                { text: "C. printf", correct: true },
                { text: "D. for", correct: false }
              ]
            }
          ]
        },
        {
          id: "law",
          name: "Pháp luật",
          questions: [
            {
              question: "Hiến pháp là gì?",
              answers: [
                { text: "A. Luật dân sự", correct: false },
                { text: "B. Luật cơ bản của Nhà nước", correct: true },
                { text: "C. Bộ luật hình sự", correct: false },
                { text: "D. Quy định công ty", correct: false }
              ]
            },
            {
              question: "Nội dung quyền công dân thường liên quan đến?",
              answers: [
                { text: "A. Quyền và nghĩa vụ của công dân", correct: true },
                { text: "B. Chỉ quyền sở hữu nhà", correct: false },
                { text: "C. Chỉ nghĩa vụ thuế", correct: false },
                { text: "D. Chỉ quyền học tập", correct: false }
              ]
            }
          ]
        },
        {
          id: "math",
          name: "Toán học",
          questions: [
            {
              question: "2 + 2 = ?",
              answers: [
                { text: "A. 3", correct: false },
                { text: "B. 4", correct: true },
                { text: "C. 5", correct: false },
                { text: "D. 6", correct: false }
              ]
            }
          ]
        }
      ];

      const tabsEl = document.getElementById("tabs");
      const panelsEl = document.getElementById("panels");

      function renderSubjectTabs() {
        subjects.forEach((subject, index) => {
          const tab = document.createElement("button");
          tab.className = "tab " + (index === 0 ? "active" : "");
          tab.textContent = subject.name;
          tab.dataset.target = subject.id;
          tab.addEventListener("click", () => {
            document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
            document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
            tab.classList.add("active");
            document.getElementById(subject.id).classList.add("active");
          });
          tabsEl.appendChild(tab);
        });
      }

      function renderPanels() {
        subjects.forEach((subject, subjectIndex) => {
          const panel = document.createElement("div");
          panel.id = subject.id;
          panel.className = "panel " + (subjectIndex === 0 ? "active" : "");

          const title = document.createElement("div");
          title.className = "subject-title";
          title.textContent = subject.name;
          panel.appendChild(title);

          subject.questions.forEach((question, qIndex) => {
            const questionBox = document.createElement("div");
            questionBox.className = "question-box";

            const q = document.createElement("div");
            q.className = "question";
            q.textContent = `${qIndex + 1}. ${question.question}`;
            questionBox.appendChild(q);

            const answersWrap = document.createElement("div");
            answersWrap.className = "answers";

            question.answers.forEach(answer => {
              const btn = document.createElement("button");
              btn.className = "answer";
              btn.type = "button";
              btn.textContent = answer.text;

              btn.addEventListener("click", () => {
                const allAnswers = Array.from(btn.parentElement.querySelectorAll(".answer"));
                allAnswers.forEach(item => item.classList.remove("correct", "wrong"));

                const result = btn.parentElement.parentElement.querySelector(".result");

                if (answer.correct) {
                  btn.classList.add("correct");
                  result.textContent = "Đúng rồi! Bạn chọn đáp án chính xác.";
                  result.style.background = "#dcfce7";
                  result.style.borderColor = "#86efac";
                  result.style.color = "#166534";
                } else {
                  btn.classList.add("wrong");

                  const correctAnswer = question.answers.find(a => a.correct);
                  allAnswers.forEach(item => {
                    if (item.textContent.includes(correctAnswer.text.split(".")[1].trim())) {
                      item.classList.add("correct");
                    }
                  });

                  result.textContent = "Sai rồi! Đáp án đúng là: " + correctAnswer.text;
                  result.style.background = "#fee2e2";
                  result.style.borderColor = "#fca5a5";
                  result.style.color = "#991b1b";
                }

                result.classList.add("show");
              });

              answersWrap.appendChild(btn);
            });

            const result = document.createElement("div");
            result.className = "result";
            questionBox.appendChild(answersWrap);
            questionBox.appendChild(result);

            panel.appendChild(questionBox);
          });

          panelsEl.appendChild(panel);
        });
      }

      renderSubjectTabs();
      renderPanels();
    </script>
  </body>
</html>
