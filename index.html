<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal</title>
    <style>
      :root {
        --bg: #dfe3e8;
        --panel: #f3f5f7;
        --white: #ffffff;
        --text: #1b2430;
        --muted: #57657a;
        --line: #d7dfe7;
        --blue: #2f6ef5;
        --blue-2: #5a8dff;
        --blue-soft: #eaf1ff;
        --shadow: 0 12px 26px rgba(27, 36, 48, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        background: var(--bg);
        font-family: "Segoe UI", Arial, sans-serif;
        color: var(--text);
      }

      body {
        min-height: 100vh;
        padding: 26px;
      }

      .page {
        max-width: 1280px;
        margin: 0 auto;
        background: transparent;
      }

      .shell {
        background: rgba(255,255,255,0.2);
        border: 1px solid var(--line);
        border-radius: 20px;
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(255,255,255,0.5);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 20px 24px;
        box-shadow: var(--shadow);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .logo {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--blue), var(--blue-2));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 800;
        font-size: 26px;
      }

      .brand-main {
        font-size: clamp(28px, 3vw, 44px);
        font-weight: 800;
        letter-spacing: -0.05em;
      }

      .brand-sub {
        margin-top: 6px;
        font-size: clamp(18px, 1.8vw, 28px);
        color: var(--muted);
        font-weight: 500;
      }

      .top-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .pill {
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.35);
        color: var(--text);
        border-radius: 999px;
        padding: 12px 20px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
      }

      .main {
        padding: 26px 0 0;
      }

      .section-title {
        font-size: clamp(28px, 3vw, 50px);
        font-weight: 800;
        letter-spacing: -0.04em;
        margin: 0 0 18px 18px;
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(320px, 1fr));
        gap: 20px;
        padding: 0 18px 18px;
      }

      .subject-card {
        background: rgba(255,255,255,0.42);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 20px;
        min-height: 310px;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: 0.2s ease;
      }

      .subject-card:hover {
        transform: translateY(-3px);
      }

      .subject-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .subject-icon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, var(--blue-soft), #edf4ff);
        border: 1px solid rgba(90,141,255,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 800;
        color: var(--blue);
      }

      .subject-badge {
        background: rgba(47,110,245,0.08);
        border: 1px solid rgba(47,110,245,0.2);
        border-radius: 999px;
        padding: 8px 12px;
        color: var(--blue);
        font-size: 13px;
        font-weight: 700;
      }

      .subject-name {
        font-size: clamp(28px, 2vw, 42px);
        font-weight: 800;
        letter-spacing: -0.04em;
        margin: 0 0 12px;
      }

      .subject-desc {
        color: var(--muted);
        font-size: 18px;
        line-height: 1.6;
        margin: 0 0 22px;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(170px, 1fr));
        gap: 12px;
      }

      .stat-box {
        background: rgba(255,255,255,0.34);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px 14px;
        min-height: 100px;
      }

      .stat-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }

      .stat-bullet {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: rgba(47,110,245,0.12);
        color: var(--blue);
        font-weight: 800;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 14px;
      }

      .stat-label {
        color: var(--muted);
        font-size: 14px;
      }

      .stat-value {
        font-size: clamp(22px, 1.8vw, 36px);
        font-weight: 800;
      }

      .cta {
        margin-top: 18px;
        width: 100%;
        border: none;
        background: linear-gradient(135deg, var(--blue), var(--blue-2));
        color: white;
        border-radius: 16px;
        padding: 18px 20px;
        font-size: clamp(22px, 2vw, 30px);
        font-weight: 800;
        cursor: pointer;
      }

      @media (max-width: 900px) {
        body {
          padding: 18px;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .brand-main {
          font-size: 32px;
        }

        .card-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="shell">
        <header class="topbar">
          <div class="brand">
            <div class="logo">S</div>
            <div>
              <div class="brand-main">Student Portal</div>
              <div class="brand-sub">Learning Dashboard</div>
            </div>
          </div>

          <div class="top-actions">
            <button class="pill">Học tập</button>
            <button class="pill">Bài kiểm tra</button>
          </div>
        </header>

        <main class="main">
          <h2 class="section-title">Các môn học</h2>

          <div id="subjectGrid" class="card-grid"></div>
        </main>
      </div>
    </div>

    <script>
      const subjects = [
        {
          id: "math",
          name: "Pháp Luật Đại Cương",
          badge: "HCMUTE 2023 • 298 Trang",
          description: "Nắm vững bản chất Nhà nước & Pháp luật, các ngành luật cơ bản (Dân sự, Hình sự, Lao động, Hôn nhân và Gia đình) và Luật Phòng chống tham nhũng.",
          stats: [
            { label: "Ngân hàng câu hỏi", value: "195 câu MCQ" },
            { label: "Thẻ nhớ flashcards", value: "110 thẻ" },
            { label: "Thi thử chuẩn", value: "40 câu / 60 phút" },
            { label: "Chương giáo trình", value: "7 chương" }
          ],
          icon: "B"
        },
        {
          id: "cplus",
          name: "Lập trình C/C++",
          badge: "Mới ra mắt • 9 Chương",
          description: "Giải thích chương trình UTT & UIT, C/C++, cấu trúc dữ liệu, hướng đối tượng và môi trường lập trình.",
          stats: [
            { label: "Ngân hàng câu hỏi", value: "270 câu MCQ" },
            { label: "Thẻ nhớ flashcards", value: "125 thẻ" },
            { label: "Thi thử chuẩn", value: "45 câu / 90 phút" },
            { label: "Chương giáo trình", value: "9 chương" }
          ],
          icon: "</>"
        },
        {
          id: "database",
          name: "Cơ sở dữ liệu",
          badge: "Mới ra mắt • 8 Chương",
          description: "Xây dựng nền tảng dữ liệu, mô hình quan hệ, SQL và quy trình quản lý dữ liệu hiệu quả.",
          stats: [
            { label: "Ngân hàng câu hỏi", value: "220 câu MCQ" },
            { label: "Thẻ nhớ flashcards", value: "90 thẻ" },
            { label: "Thi thử chuẩn", value: "38 câu / 60 phút" },
            { label: "Chương giáo trình", value: "8 chương" }
          ],
          icon: "DB"
        },
        {
          id: "network",
          name: "Mạng máy tính",
          badge: "Mới ra mắt • 6 Chương",
          description: "Nền tảng mạng, giao thức, mô hình OSI và các nguyên tắc vận hành hệ thống mạng.",
          stats: [
            { label: "Ngân hàng câu hỏi", value: "180 câu MCQ" },
            { label: "Thẻ nhớ flashcards", value: "80 thẻ" },
            { label: "Thi thử chuẩn", value: "32 câu / 60 phút" },
            { label: "Chương giáo trình", value: "6 chương" }
          ],
          icon: "NET"
        }
      ];

      const grid = document.getElementById("subjectGrid");

      function renderSubjects() {
        grid.innerHTML = "";

        subjects.forEach((subject) => {
          const card = document.createElement("div");
          card.className = "subject-card";

          card.innerHTML = `
            <div class="subject-head">
              <div class="subject-icon">${subject.icon}</div>
              <div class="subject-badge">${subject.badge}</div>
            </div>

            <h3 class="subject-name">${subject.name}</h3>
            <p class="subject-desc">${subject.description}</p>

            <div class="stats">
              ${subject.stats.map(stat => `
                <div class="stat-box">
                  <div class="stat-row">
                    <div class="stat-bullet">${stat.label.charAt(0)}</div>
                    <div class="stat-label">${stat.label}</div>
                  </div>
                  <div class="stat-value">${stat.value}</div>
                </div>
              `).join("")}
            </div>

            <button class="cta">Vào ôn tập ${subject.name}</button>
          `;
          grid.appendChild(card);
        });
      }

      renderSubjects();
    </script>
  </body>
</html>
